[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["skills/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/chat"
  to = "/chat/index.html"
  status = 200

[[redirects]]
  from = "/chat/"
  to = "/chat/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
