[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["skills/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/chat"
  to = "/chat/index.html"
  status = 200

[[redirects]]
  from = "/chat/"
  to = "/chat/index.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing/index.html"
  status = 200

[[redirects]]
  from = "/pricing/"
  to = "/pricing/index.html"
  status = 200

[[redirects]]
  from = "/refund"
  to = "/refund/index.html"
  status = 200

[[redirects]]
  from = "/refund/"
  to = "/refund/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
