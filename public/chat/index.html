<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>镜室 Chat | Mirror Room</title>
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" defer></script>
  </head>
  <body class="chat-page">
    <main class="mirror-shell">
      <header class="top-zone">
        <nav class="dock dock-split" aria-label="对话控制台">
          <div class="dock-zone dock-left">
            <a class="dock-item dock-link home-link" href="/">
              <span>主页</span>
              <strong>镜室</strong>
            </a>
          </div>

          <div class="dock-zone dock-center">
            <button class="dock-item" data-modal="skill">
              <span>对话对象</span>
              <strong id="skill-label">毛选</strong>
            </button>
            <button class="dock-item" data-modal="counterpart">
              <span>你是谁</span>
              <strong id="counterpart-label">未填写</strong>
            </button>
            <button class="dock-item" data-modal="scene">
              <span>语气场景</span>
              <strong id="scene-label">真我复盘</strong>
            </button>
            <button class="dock-item wide" data-modal="model">
              <span>模型</span>
              <strong id="model-label">DeepSeek v4 Flash</strong>
            </button>
            <button class="dock-item compact" data-modal="temperature">
              <span>温度</span>
              <strong id="temperature-label">0.7</strong>
            </button>
          </div>

          <div class="dock-zone dock-right">
            <button class="dock-item auth" data-modal="auth">
              <span>账户</span>
              <strong id="auth-label">登录 / 注册</strong>
            </button>
            <a class="dock-item dock-link pricing-link" href="/pricing">
              <span>定价说明</span>
              <strong>套餐</strong>
            </a>
          </div>
        </nav>
      </header>

      <section class="workspace">
        <aside class="history-panel" aria-label="历史对话">
          <div class="panel-head">
            <div>
              <p class="eyebrow">history</p>
              <h2>历史对话</h2>
            </div>
            <div class="history-actions">
              <button id="toggle-history" class="icon-button subtle" type="button">折叠</button>
              <button id="new-chat" class="icon-button" type="button">新建</button>
            </div>
          </div>
          <div id="conversation-list" class="conversation-list"></div>
        </aside>

        <section class="chat-panel" aria-label="对话详情">
          <header class="chat-header">
            <div>
              <p class="status-dot"><span></span> protected skill channel</p>
              <h2 id="chat-title">新的镜室对话</h2>
            </div>
            <div class="chat-header-actions">
              <button id="export-md" type="button" class="ghost-button">导出 MD</button>
              <button id="clear" type="button" class="ghost-button">清空当前</button>
            </div>
          </header>

          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="composer" class="composer">
            <textarea
              id="prompt"
              rows="2"
              placeholder="登录后开始。可以先说：我是你本人，想复盘一件事。"
            ></textarea>
            <button type="submit">发送</button>
          </form>
        </section>
      </section>
    </main>

    <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="modal-close" class="modal-close" type="button" aria-label="关闭">×</button>
        <p id="modal-kicker" class="eyebrow">setting</p>
        <h2 id="modal-title">设置</h2>
        <div id="modal-body" class="modal-body"></div>
      </section>
    </div>

    <template id="message-template">
      <article class="message">
        <div class="avatar"></div>
        <div class="bubble">
          <div class="role"></div>
          <div class="content"></div>
        </div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
    <script src="/notifications.js" type="module"></script>
  </body>
</html>
