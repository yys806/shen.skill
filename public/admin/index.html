<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>镜室后台 | Admin</title>
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="home-page admin-page locked">
    <main id="admin-main" class="skill-detail-shell admin-main hidden">
      <nav class="skill-detail-nav">
        <a class="home-brand" href="/"><span></span><strong>镜室后台</strong></a>
        <div>
          <a href="/submit-skill/">提交页</a>
          <a href="/">回首页</a>
        </div>
      </nav>

      <section class="admin-head">
        <p class="home-kicker">admin console</p>
        <h1>镜室后台</h1>
        <p>管理员可审核 skill、支付记录，查看用户状态，调整套餐和管理公开 skill。</p>
      </section>

      <section class="admin-panel">
        <div id="admin-auth" class="submission-auth"></div>
        <div class="admin-tabs" role="tablist" aria-label="后台功能">
          <button class="active" data-admin-tab="submissions" type="button">Skill 审批</button>
          <button data-admin-tab="skills" type="button">Skill 管理</button>
          <button data-admin-tab="payments" type="button">支付审核</button>
          <button data-admin-tab="users" type="button">用户管理</button>
        </div>
        <div id="submission-tools" class="admin-tools">
          <select id="status-filter" aria-label="按审核状态筛选">
            <option value="all">全部状态</option>
            <option value="pending">待审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option>
            <option value="published">已发布</option>
          </select>
        </div>
        <div id="user-tools" class="admin-tools hidden">
          <input id="user-search" type="search" placeholder="搜索邮箱或昵称" />
        </div>
        <div id="submission-list" class="submission-list"></div>
        <div id="skill-list" class="submission-list hidden"></div>
        <div id="payment-list" class="submission-list hidden"></div>
        <div id="user-list" class="submission-list hidden"></div>
      </section>
    </main>

    <section id="admin-gate" class="admin-gate">
      <div class="admin-gate-card">
        <p class="home-kicker">admin login</p>
        <h1>进入后台</h1>
        <p>请使用管理员邮箱登录。验证通过后才会加载后台数据。</p>
        <label for="admin-email">邮箱</label>
        <input id="admin-email" type="email" autocomplete="username" placeholder="管理员邮箱" />
        <label for="admin-password">密码</label>
        <input id="admin-password" type="password" autocomplete="current-password" placeholder="管理员密码" />
        <button id="admin-login" class="modal-primary" type="button">登录后台</button>
        <p id="admin-login-feedback" class="field-help"></p>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/admin/admin.js"></script>
  </body>
</html>
