        <article>
          <h2>试用性质</h2>
          <p>镜室目前是公开试用版，功能、模型、skill 库和后台流程可能持续调整。我们会尽量保持稳定，但不承诺任何特定可用性或结果。</p>
        </article>
        <article>
          <h2>AI 输出边界</h2>
          <p>AI 回复只用于思考辅助和信息整理，不构成法律、医疗、金融等专业建议。重要决策请结合现实资料和专业人士意见。</p>
        </article>
        <article>
          <h2>用户提交内容</h2>
          <p>你提交 skill 时需要确保仓库内容合法、可公开、无恶意代码或侵犯他人权利。管理员审核通过不代表对仓库全部内容作出背书。</p>
        </article>
        <article>
          <h2>禁止用途</h2>
          <p>禁止使用镜室生成违法、侵权、骚扰、欺诈、恶意攻击、绕过安全系统或其他伤害他人的内容。违反规则的账号和提交可能被限制或删除。</p>
        </article>
