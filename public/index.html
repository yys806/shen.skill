<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>镜室 Mirror Room</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="mirror-shell">
      <header class="top-zone">
        <section class="intro-card" aria-label="镜室介绍">
          <p class="eyebrow">mirror room / skill console</p>
          <h1>镜室</h1>
          <p>
            一个可扩展的 skill 对话台。先选择要启用的 skill，再选择模型与温度；
            需要身份和语气的 skill 会额外打开对应控制项。
          </p>
        </section>

        <nav class="dock" aria-label="对话控制台">
          <button class="dock-item" data-modal="skill">
            <span>对话对象</span>
            <strong id="skill-label">禹尧珅</strong>
          </button>
          <button class="dock-item" data-modal="counterpart">
            <span>你是谁</span>
            <strong id="counterpart-label">未填写</strong>
          </button>
          <button class="dock-item" data-modal="scene">
            <span>语气场景</span>
            <strong id="scene-label">真我复盘</strong>
          </button>
          <button class="dock-item wide" data-modal="model">
            <span>模型</span>
            <strong id="model-label">Kimi-K2.6</strong>
          </button>
          <button class="dock-item compact" data-modal="temperature">
            <span>温度</span>
            <strong id="temperature-label">0.7</strong>
          </button>
          <button class="dock-item auth" data-modal="auth">
            <span>账户</span>
            <strong id="auth-label">登录 / 注册</strong>
          </button>
        </nav>
      </header>

      <section class="workspace">
        <aside class="history-panel" aria-label="历史对话">
          <div class="panel-head">
            <div>
              <p class="eyebrow">history</p>
              <h2>历史对话</h2>
            </div>
            <div class="history-actions">
              <button id="toggle-history" class="icon-button subtle" type="button">折叠</button>
              <button id="new-chat" class="icon-button" type="button">新建</button>
            </div>
          </div>
          <div id="conversation-list" class="conversation-list"></div>
        </aside>

        <section class="chat-panel" aria-label="对话详情">
          <header class="chat-header">
            <div>
              <p class="status-dot"><span></span> protected skill channel</p>
              <h2 id="chat-title">新的镜室对话</h2>
            </div>
            <button id="clear" type="button" class="ghost-button">清空当前</button>
          </header>

          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="composer" class="composer">
            <textarea
              id="prompt"
              rows="2"
              placeholder="登录后开始。可以先说：我是你本人，想复盘一件事。"
            ></textarea>
            <button type="submit">发送</button>
          </form>
        </section>
      </section>
    </main>

    <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="modal-close" class="modal-close" type="button" aria-label="关闭">×</button>
        <p id="modal-kicker" class="eyebrow">setting</p>
        <h2 id="modal-title">设置</h2>
        <div id="modal-body" class="modal-body"></div>
      </section>
    </div>

    <template id="message-template">
      <article class="message">
        <div class="avatar"></div>
        <div class="bubble">
          <div class="role"></div>
          <div class="content"></div>
        </div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
