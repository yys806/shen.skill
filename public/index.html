<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shen.skill mirror</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-label="应用介绍">
        <div class="brand-mark">珅</div>
        <p class="eyebrow">private mirror / shen.skill</p>
        <h1>和另一个“禹尧珅”对话。</h1>
        <p class="lead">
          先登录，再进入镜室。这个网页会读取项目内的 shen.skill，
          用 SiliconFlow 模型回答；聊天前会先判断“你是谁”，再切换语气。
        </p>

        <div class="auth-card" id="auth-card">
          <div class="auth-topline">
            <span id="auth-state">checking auth</span>
            <button id="logout" type="button" class="ghost hidden">退出</button>
          </div>
          <div id="auth-form" class="auth-form">
            <label for="email">邮箱</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />

            <label for="password">密码</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位" />

            <div class="auth-actions">
              <button id="login" type="button">登录</button>
              <button id="signup" type="button" class="secondary">注册</button>
            </div>
            <p id="auth-hint" class="auth-hint">注册登录由 Supabase 托管，聊天 API 只接受已登录用户。</p>
          </div>
        </div>

        <div class="identity-card">
          <label for="counterpart">对方是谁</label>
          <input id="counterpart" placeholder="比如：我本人 / 老师 / 学姐 / 女朋友 / 朋友" />

          <label for="scene">语气场景</label>
          <select id="scene">
            <option value="self">真我复盘：理性、短句、拆动机</option>
            <option value="work">工作科研：严谨、清楚、可执行</option>
            <option value="friend">朋友室友：松弛、接梗、嘴碎一点</option>
            <option value="family">家人：简短、报备、让人放心</option>
            <option value="relationship">亲密关系：软一点、会哄人</option>
          </select>

          <div class="model-grid">
            <div>
              <label for="model">模型</label>
              <input id="model" value="Qwen/Qwen2.5-72B-Instruct" />
            </div>
            <div>
              <label for="temperature">温度</label>
              <input id="temperature" type="number" min="0" max="1.5" step="0.1" value="0.7" />
            </div>
          </div>
        </div>

        <div class="signals">
          <span>Supabase Auth</span>
          <span>Netlify Functions</span>
          <span>API key 后端隐藏</span>
          <span>skills 可扩展</span>
        </div>
      </section>

      <section class="chat-panel" aria-label="聊天窗口">
        <header class="chat-header">
          <div>
            <p class="status-dot"><span></span> protected mirror</p>
            <h2>镜室</h2>
          </div>
          <button id="clear" type="button">清空</button>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="composer" class="composer">
          <textarea
            id="prompt"
            rows="2"
            placeholder="登录后开始。先说一句：你是谁，或者直接把想复盘的事丢进来。"
          ></textarea>
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <template id="message-template">
      <article class="message">
        <div class="avatar"></div>
        <div class="bubble">
          <div class="role"></div>
          <div class="content"></div>
        </div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
